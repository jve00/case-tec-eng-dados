[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-declarative-window-case"
version = "0.1.0"
description = "Case técnico de engenharia de dados com PySpark e window functions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyspark>=3.5,<3.6",
  "pyarrow>=14,<19"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pandas>=2,<3",
  "black>=24,<25",
  "ruff>=0.6,<1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
